<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tidal Wave Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000c1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 183, 255, 0.4);
            border: 3px solid #00d2ff;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { display: block; background: #000; cursor: pointer; }
        .ui-element {
            position: absolute;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00d2ff;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        #left-ui { top: 25px; left: 30px; font-size: 18px; color: #00ffff; }
        #right-ui { top: 25px; right: 30px; font-size: 18px; color: #00ffaa; }
        #progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(0, 24, 51, 0.6);
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #00ffff, #00ffaa);
            box-shadow: 0 0 10px #00ffff;
            transition: width 0.1s linear;
        }
        #instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #557a95;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="left-ui" class="ui-element">ATTEMPT: <span id="attempt-val">1</span></div>
        <div id="right-ui" class="ui-element">WAVE MODE</div>
        <canvas id="tidalCanvas" width="950" height="480"></canvas>
    </div>

    <div id="instructions">
        <strong>TIDAL WAVE CONTROLS:</strong> HOLD SPACEBAR or MOUSE CLICK to rise.<br>
        RELEASE to dive. Reach 100% to win!
    </div>

<script>
const canvas = document.getElementById("tidalCanvas");
const ctx = canvas.getContext("2d");

// GAME STATE
let gameStarted = false;
let gameOver = false;
let attempts = 1;
let progress = 0;
let isPressing = false;

const floorLimit = canvas.height - 65;
const ceilingLimit = 65;

let hazards = [];
let bgTimer = 0;

// PLAYER
const player = {
    x: 180,
    y: (floorLimit + ceilingLimit) / 2,
    size: 26,
    speedY: 6.5,
    rotation: 0
};

// AUDIO — NEW AMBIENT OCEAN MUSIC
let audioCtx = null;

function startAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const master = audioCtx.createGain();
    master.gain.value = 0.35;
    master.connect(audioCtx.destination);

    // Soft ocean hum
    const hum = audioCtx.createOscillator();
    hum.type = "sine";
    hum.frequency.value = 80;

    const humGain = audioCtx.createGain();
    humGain.gain.value = 0.25;

    hum.connect(humGain);
    humGain.connect(master);
    hum.start();

    // Gentle wave shimmer
    const shimmer = audioCtx.createOscillator();
    shimmer.type = "triangle";
    shimmer.frequency.value = 420;

    const shimmerGain = audioCtx.createGain();
    shimmerGain.gain.value = 0.05;

    shimmer.connect(shimmerGain);
    shimmerGain.connect(master);
    shimmer.start();

    // Slow LFO to modulate shimmer
    const lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.25;

    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 40;

    lfo.connect(lfoGain);
    lfoGain.connect(shimmer.frequency);
    lfo.start();
}

function playExplosion() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

// INPUT
function handleInput(state) {
    if (!gameStarted && state) {
        startAudio();
        gameStarted = true;
        document.querySelectorAll(".ui-element").forEach(el => el.style.display = "block");
        document.getElementById("progress-container").style.display = "block";
        spawnHazard();
        return;
    }

    if (gameOver && state) resetGame();
    isPressing = state;
}

window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        handleInput(true);
    }
});
window.addEventListener("keyup", e => {
    if (e.code === "Space" || e.code === "ArrowUp") handleInput(false);
});
canvas.addEventListener("mousedown", () => handleInput(true));
canvas.addEventListener("mouseup", () => handleInput(false));

// HAZARD GENERATION
function spawnHazard() {
    if (gameOver || progress >= 100) return;

    const gapSize = Math.max(95, 150 - progress * 0.8);
    const rand = Math.random();

    if (rand < 0.5) {
        const openY = Math.random() * (floorLimit - ceilingLimit - gapSize - 40) + ceilingLimit + 20;

        hazards.push({ x: canvas.width, y: ceilingLimit, width: 45, height: openY - ceilingLimit });
        hazards.push({ x: canvas.width, y: openY + gapSize, width: 45, height: floorLimit - (openY + gapSize) });
    } else {
        const pillarH = Math.random() * 80 + 50;
        const top = Math.random() > 0.5;

        hazards.push({
            x: canvas.width,
            y: top ? ceilingLimit : floorLimit - pillarH,
            width: 35,
            height: pillarH
        });
    }

    const interval = Math.max(450, Math.random() * 800 + 600 - 120);
    setTimeout(spawnHazard, interval);
}

// RESET
function resetGame() {
    hazards = [];
    player.y = (floorLimit + ceilingLimit) / 2;
    player.rotation = 0;
    progress = 0;
    attempts++;
    gameOver = false;
    isPressing = false;

    document.getElementById("attempt-val").innerText = attempts;
    document.getElementById("progress-bar").style.width = "0%";

    spawn
