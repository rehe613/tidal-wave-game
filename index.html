<script>
const canvas = document.getElementById("tidalCanvas");
const ctx = canvas.getContext("2d");

// =========================
// GAME STATE
// =========================
let gameStarted = false;
let gameOver = false;
let attempts = 1;
let progress = 0;
let isPressing = false;

const floorLimit = canvas.height - 65;
const ceilingLimit = 65;

let hazards = [];
let bgTimer = 0;

// =========================
// PLAYER
// =========================
const player = {
    x: 180,
    y: (floorLimit + ceilingLimit) / 2,
    size: 26,
    speedY: 6.5,
    rotation: 0
};

// =========================
// AUDIO
// =========================
let audioCtx = null;

function startAudio() {
    if (audioCtx) return;
    audioCtx = new AudioContext();

    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.5, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {
        const t = i / audioCtx.sampleRate;
        const step = t % 0.18;
        data[i] = Math.sin(2 * Math.PI * 85 * step) * Math.exp(-12 * step) * 0.35;
        data[i] += (Math.random() - 0.5) * 0.08 * Math.exp(-8 * step);
    }

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    src.connect(audioCtx.destination);
    src.start();
}

function playExplosion() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

// =========================
// INPUT
// =========================
function handleInput(state) {
    if (!gameStarted && state) {
        startAudio();
        gameStarted = true;
        document.querySelectorAll(".ui-element").forEach(el => el.style.display = "block");
        document.getElementById("progress-container").style.display = "block";
        spawnHazard();
        return;
    }

    if (gameOver && state) resetGame();
    isPressing = state;
}

window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        handleInput(true);
    }
});
window.addEventListener("keyup", e => {
    if (e.code === "Space" || e.code === "ArrowUp") handleInput(false);
});
canvas.addEventListener("mousedown", () => handleInput(true));
canvas.addEventListener("mouseup", () => handleInput(false));

// =========================
// HAZARD GENERATION
// =========================
function spawnHazard() {
    if (gameOver || progress >= 100) return;

    const gapSize = Math.max(95, 150 - progress * 0.8);
    const rand = Math.random();

    if (rand < 0.5) {
        const openY = Math.random() * (floorLimit - ceilingLimit - gapSize - 40) + ceilingLimit + 20;

        hazards.push({ x: canvas.width, y: ceilingLimit, width: 45, height: openY - ceilingLimit });
        hazards.push({ x: canvas.width, y: openY + gapSize, width: 45, height: floorLimit - (openY + gapSize) });
    } else {
        const pillarH = Math.random() * 80 + 50;
        const top = Math.random() > 0.5;

        hazards.push({
            x: canvas.width,
            y: top ? ceilingLimit : floorLimit - pillarH,
            width: 35,
            height: pillarH
        });
    }

    const interval = Math.max(450, Math.random() * 800 + 600 - 120);
    setTimeout(spawnHazard, interval);
}

// =========================
// RESET
// =========================
function resetGame() {
    hazards = [];
    player.y = (floorLimit + ceilingLimit) / 2;
    player.rotation = 0;
    progress = 0;
    attempts++;
    gameOver = false;
    isPressing = false;

    document.getElementById("attempt-val").innerText = attempts;
    document.getElementById("progress-bar").style.width = "0%";

    spawnHazard();
}

// =========================
// COLLISION
// =========================
function checkCollision(h) {
    return (
        player.x + player.size > h.x &&
        player.x - player.size < h.x + h.width &&
        player.y + player.size > h.y &&
        player.y - player.size < h.y + h.height
    );
}

// =========================
// RENDER LOOP
// =========================
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameStarted) {
        ctx.fillStyle = "#00ffff";
        ctx.font = "bold 42px monospace";
        ctx.textAlign = "center";
        ctx.fillText("🌊 TIDAL WAVE 🌊", canvas.width / 2, canvas.height / 2 - 25);
        ctx.fillStyle = "#fff";
        ctx.font = "16px monospace";
        ctx.fillText("CLICK ANYWHERE TO BEGIN", canvas.width / 2, canvas.height / 2 + 25);
        return requestAnimationFrame(update);
    }

    // Background
    bgTimer += 0.015;
    const shift = Math.sin(bgTimer) * 15;

    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, "#00142d");
    grad.addColorStop(0.5, "#002b54");
    grad.addColorStop(1, "#000914");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sun rays
    ctx.fillStyle = "rgba(0,255,255,0.03)";
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(200 + i * 150 + shift, 0);
        ctx.lineTo(350 + i * 200 + shift, canvas.height);
        ctx.lineTo(150 + i * 200 + shift, canvas.height);
        ctx.fill();
    }

    // Player physics
    if (!gameOver && progress < 100) {
        player.y += isPressing ? -player.speedY : player.speedY;
        player.rotation = isPressing ? -0.35 : 0.35;

        player.y = Math.max(ceilingLimit + player.size, Math.min(floorLimit - player.size, player.y));

        hazards.forEach(h => h.x -= 8);
        hazards = hazards.filter(h => h.x + h.width > 0);

        hazards.forEach(h => {
            if (checkCollision(h)) {
                gameOver = true;
                playExplosion();
            }
        });

        progress += 0.12;
        document.getElementById("progress-bar").style.width = progress + "%";
    }

    // Draw hazards
    ctx.fillStyle = "#00d2ff";
    hazards.forEach(h => ctx.fillRect(h.x, h.y, h.width, h.height));

    // Draw player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.rotation);
    ctx.fillStyle = "#00ffaa";
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.restore();

    requestAnimationFrame(update);
}

update();
</script>
