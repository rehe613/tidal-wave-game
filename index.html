<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tidal Wave Edition</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #000c1a;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        color: #fff;
    }
    #game-container {
        position: relative;
        box-shadow: 0 0 50px rgba(0, 183, 255, 0.4);
        border: 3px solid #00d2ff;
        border-radius: 12px;
        overflow: hidden;
    }
    canvas { display: block; background: #000; cursor: pointer; }

    /* MENU */
    #menu {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(#00142d, #000914);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
    }
    #menu h1 {
        font-size: 48px;
        color: #00ffff;
        text-shadow: 0 0 20px #00ffff;
        margin-bottom: 20px;
    }
    #play-btn {
        padding: 12px 28px;
        font-size: 22px;
        background: #00ffaa;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        color: #003322;
        font-weight: bold;
        box-shadow: 0 0 15px #00ffaa;
        transition: 0.2s;
    }
    #play-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 25px #00ffaa;
    }

    /* UI */
    .ui-element {
        position: absolute;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 0 8px #00d2ff;
        pointer-events: none;
        z-index: 10;
        display: none;
    }
    #left-ui { top: 25px; left: 30px; font-size: 18px; color: #00ffff; }
    #right-ui { top: 25px; right: 30px; font-size: 18px; color: #00ffaa; }
    #progress-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: rgba(0, 24, 51, 0.6);
        display: none;
    }
    #progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(to right, #00ffff, #00ffaa);
        box-shadow: 0 0 10px #00ffff;
        transition: width 0.1s linear;
    }
</style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>TIDAL WAVE</h1>
        <button id="play-btn">PLAY</button>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="left-ui" class="ui-element">ATTEMPT: <span id="attempt-val">1</span></div>
    <div id="right-ui" class="ui-element">WAVE MODE</div>
    <canvas id="tidalCanvas" width="950" height="480"></canvas>
</div>
